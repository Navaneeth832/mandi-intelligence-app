name: Deploy Web App & Documentation

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Build and Release APK
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Build Documentation Website
        run: |
          python scripts/build_docs.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web App
        run: flutter build web --release --base-href "/mandi-intelligence-app/"

      - name: Prepare Combined Pages Directory (_site)
        run: |
          mkdir -p _site/docs
          # 1. Copy Flutter Web App to root of _site
          if [ -d "build/web" ]; then
            cp -r build/web/* _site/
          fi
          # 2. Copy Technical Documentation to _site/docs/
          cp -r docs/* _site/docs/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
