name: Build and Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.x"

      - name: Install QR Library
        run: pip install qrcode[pil]

      - name: Generate QR Code
        run: |
          python <<EOF
          import qrcode
      
          url = "https://github.com/Navaneeth832/mandi-intelligence-app/releases/download/latest/app-release.apk"
      
          img = qrcode.make(url)
          img.save("latest-release-qr.png")
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            latest-release-qr.png