name: Mock Prediction Generator

on:
  schedule:
    # 03:24 AM IST
    - cron: "54 21 * * *"

    # 11:17 AM IST
    - cron: "47 5 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Mock Predictions
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python mock_prediction_generator.py

      - name: Verify Latest Prediction Batch
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - << 'EOF'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])

          with engine.connect() as conn:
              print("\n========== Latest Prediction Batches ==========\n")

              rows = conn.execute(text("""
                  SELECT
                      id,
                      prediction_date,
                      prediction_time,
                      model_version,
                      created_at
                  FROM prediction_batches
                  ORDER BY id DESC
                  LIMIT 5;
              """)).fetchall()

              for row in rows:
                  print(row)

              print("\n========== Latest Prediction Counts ==========\n")

              rows = conn.execute(text("""
                  SELECT
                      batch_id,
                      COUNT(*) AS predictions
                  FROM commodity_predictions
                  GROUP BY batch_id
                  ORDER BY batch_id DESC
                  LIMIT 5;
              """)).fetchall()

              for row in rows:
                  print(row)

          EOF