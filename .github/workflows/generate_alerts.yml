name: Generate Alerts

on:
  push:
    branches:
      - feature/alert-logic # This forces the action to run immediately when you push to this branch

# Temporarily comment out your original triggers until you are ready to merge into main:
#   workflow_run:
#     workflows: 
#       - "Hourly Mandi Price Fetch"
#       - "Mandi Price Prediction"
#     types:
#       - completed
#   workflow_dispatch:

jobs:
  generate_alerts:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded, or if we are manually testing via push/dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install python dependencies
        working-directory: backend
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run Alert Generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: backend
        run: |
          python scripts/run_alert_generation.py
