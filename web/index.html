<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mandi Intelligence Mobile Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mandi Intelligence">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mandi Intelligence</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
    }

    /* Desktop & Laptop displays (> 450px wide): Lock container to 390x884 mobile frame */
    @media (min-width: 451px) {
      html, body {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }
      
      flutter-view, flt-glass-pane, body > div {
        position: relative !important;
        width: 390px !important;
        height: 884px !important;
        max-height: 94vh !important;
        border-radius: 32px !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(56, 189, 248, 0.2) !important;
        border: 8px solid #1e293b !important;
        overflow: hidden !important;
        background-color: #FFFBF7 !important;
      }
    }

    /* Mobile screens (<= 450px wide): Fullscreen width & height */
    @media (max-width: 450px) {
      html, body, flutter-view, flt-glass-pane, body > div {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <script>
    // Automatically trigger window resize event during Flutter initialization to prevent blank startup screen
    function triggerFlutterResize() {
      window.dispatchEvent(new Event('resize'));
    }
    window.addEventListener('load', function() {
      setTimeout(triggerFlutterResize, 100);
      setTimeout(triggerFlutterResize, 300);
      setTimeout(triggerFlutterResize, 600);
      setTimeout(triggerFlutterResize, 1000);
      setTimeout(triggerFlutterResize, 1500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
